<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johan Control</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: #b0b0b0; text-align: center; padding: 20px; }
        .card { background: #111; border-radius: 4px; padding: 20px; margin-bottom: 20px; border: 1px solid #222; }
        
        /* Status */
        .status-area { display: flex; align-items: center; justify-content: center; gap: 10px; color: #888; font-size: 13px; letter-spacing: 1px; }
        .dot { height: 10px; width: 10px; border-radius: 50%; transition: 0.3s; }
        .dot-online { background-color: #00ff00; box-shadow: 0 0 8px #00ff00; }
        .dot-offline { background-color: #444; }

        h1 { font-weight: 200; letter-spacing: 10px; color: #fff; margin-bottom: 30px; }
        input, select { width: 90%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 2px; margin: 8px 0; font-size: 15px; }
        
        /* Botões */
        button { background: #1a1a1a; border: 1px solid #333; color: #888; padding: 14px; border-radius: 2px; font-size: 13px; width: 100%; margin: 5px 0; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .active-mode { background: #e0e0e0 !important; color: #000 !important; font-weight: bold; border-color: #fff !important; }
        .btn-send { background: #8b0000; color: #fff; border: none; font-weight: bold; margin-top: 10px; letter-spacing: 2px; }

        /* Alerta de Pagamento (Inteligente) */
        .pay-alert { background: #8b0000; color: #fff; padding: 10px; font-size: 11px; font-weight: bold; margin-bottom: 20px; display: none; }

        /* Abas de Pagamento */
        .payment-tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .pay-method { font-size: 10px; padding: 10px 5px; flex: 1; border: 1px solid #333; }
        
        /* Toggle Crédito/Débito */
        .card-type-selector { display: flex; justify-content: center; gap: 20px; margin-bottom: 10px; font-size: 12px; color: #fff; }
    </style>
</head>
<body>
    <h1>JOHAN</h1>

    <div id="alert-pagamento" class="pay-alert">
        AVISO: MÊS ENCERRADO OU PRÓXIMO AO VENCIMENTO. EFETUE O PAGAMENTO.
    </div>
    
    <div class="card">
        <div class="status-area">
            <span id="status-dot" class="dot dot-online"></span>
            PAINEL DO ROBÔ
        </div>
    </div>

    <div class="card">
        <h3>COMANDO DE VOZ</h3>
        <input type="text" id="frase" placeholder="O que ele deve dizer?">
        <button class="btn-send" onclick="enviarComando()">Despertar o Monstro</button>
    </div>

    <div class="card">
        <h3>PERSONALIDADE</h3>
        <div style="display: flex; gap: 10px;">
            <button id="btn-filosofo" onclick="selecionarModo('filosofo')">Filósofo</button>
            <button id="btn-vendedor" onclick="selecionarModo('vendedor')">Vendedor</button>
        </div>
    </div>

    <div class="card">
        <h3>GESTÃO DE ASSINATURA</h3>
        <div class="payment-tabs">
            <button class="pay-method" id="tab-cartao" onclick="setPayTab('cartao')">Cartão</button>
            <button class="pay-method" id="tab-boleto" onclick="setPayTab('boleto')">Boleto</button>
            <button class="pay-method" id="tab-pix" onclick="setPayTab('pix')">PIX</button>
        </div>

        <div id="sec-cartao">
            <div class="card-type-selector">
                <label><input type="radio" name="cardtype" checked> Crédito</label>
                <label><input type="radio" name="cardtype"> Débito</label>
            </div>
            <input type="text" placeholder="Número do Cartão">
            <div style="display: flex; gap: 5px;">
                <input type="text" placeholder="MM/AA" style="width: 45%;">
                <input type="text" placeholder="CVC" style="width: 45%;">
            </div>
        </div>
        
        <div id="sec-boleto" style="display:none; padding: 10px;">
            <p style="font-size:12px;">Boleto gerado para o próximo vencimento.</p>
            <button style="background:#333; color:#fff;">Baixar PDF</button>
        </div>

        <div id="sec-pix" style="display:none; padding: 10px;">
            <code style="color:#00ff00; font-size:10px; word-break:break-all;">00020126360014BR.GOV.BCB.PIX...</code>
            <button style="margin-top:10px; font-size:10px;">Copiar Código PIX</button>
        </div>

        <button onclick="confirmarPagamento()" style="background:#fff; color:#000; border:none; margin-top:15px; font-weight:bold;">EFETUAR PAGAMENTO</button>
    </div>

    <script>
        const webhookURL = "https://hook.us2.make.com/z9ug682jka8xfl9ldrnez8tnmi3apoxc";

        window.onload = function() {
            // Persistência de Personalidade
            const modoSalvo = localStorage.getItem('modoSelecionado') || 'filosofo';
            selecionarModo(modoSalvo);
            
            // Persistência de Aba de Pagamento
            const abaSalva = localStorage.getItem('abaPagamento') || 'cartao';
            setPayTab(abaSalva);

            // Lógica de Alerta: Aparece apenas após o dia 25 do mês
            const hoje = new Date();
            if (hoje.getDate() >= 25) {
                document.getElementById('alert-pagamento').style.display = 'block';
            }
        };

        function selecionarModo(modo) {
            localStorage.setItem('modoSelecionado', modo);
            document.getElementById('btn-filosofo').classList.remove('active-mode');
            document.getElementById('btn-vendedor').classList.remove('active-mode');
            document.getElementById('btn-' + modo).classList.add('active-mode');
        }

        function setPayTab(metodo) {
            localStorage.setItem('abaPagamento', metodo);
            
            // Reset de visual das abas
            ['cartao', 'boleto', 'pix'].forEach(m => {
                document.getElementById('tab-' + m).classList.remove('active-mode');
                document.getElementById('sec-' + m).style.display = 'none';
            });

            // Ativa a selecionada
            document.getElementById('tab-' + metodo).classList.add('active-mode');
            document.getElementById('sec-' + metodo).style.display = 'block';
        }

        async function enviarComando() {
            const frase = document.getElementById('frase').value;
            const dot = document.getElementById('status-dot');
            const modo = localStorage.getItem('modoSelecionado');

            try {
                const response = await fetch(webhookURL, {
                    method: 'POST',
                    body: JSON.stringify({ mensagem: frase, modo: modo }),
                    headers: { 'Content-Type': 'application/json' }
                });
                if (response.ok) { dot.className = "dot dot-online"; }
            } catch (err) { dot.className = "dot dot-offline"; }
        }

        function confirmarPagamento() {
            alert("Pagamento processado com sucesso.");
            document.getElementById('alert-pagamento').style.display = 'none';
        }
    </script>
</body>
</html>
