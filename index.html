<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johan Control</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <style>
        /* Estética Clínica e Sombria */
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: #b0b0b0; text-align: center; margin: 0; padding-top: 70px; padding-bottom: 20px; overflow-x: hidden; }
        
        /* Barra de Menu Superior */
        header { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: #111; border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; box-sizing: border-box; z-index: 1000; }
        header h1 { font-size: 18px; font-weight: 200; letter-spacing: 5px; color: #fff; margin: 0; }
        
        .icon-btn { background: none; border: none; color: #fff; cursor: pointer; padding: 10px; display: flex; align-items: center; justify-content: center; transition: 0.2s; width: auto; margin: 0; }
        .icon-btn:active { transform: scale(0.9); opacity: 0.5; }

        /* Menu Lateral (Drawer) */
        #side-menu { position: fixed; top: 0; right: -280px; width: 280px; height: 100%; background: #111; border-left: 1px solid #222; z-index: 1100; transition: 0.3s ease; padding: 20px; box-sizing: border-box; text-align: left; }
        #side-menu.open { right: 0; box-shadow: -10px 0 30px rgba(0,0,0,0.8); }
        #menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 1050; }

        /* Estilos de Card e Componentes */
        .card { background: #111; border-radius: 4px; padding: 20px; margin: 0 15px 20px 15px; border: 1px solid #222; }
        .status-area { display: flex; align-items: center; justify-content: center; gap: 10px; color: #888; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
        .dot { height: 8px; width: 8px; border-radius: 50%; background-color: #00ff00; box-shadow: 0 0 8px #00ff00; }
        
        input[type="text"], input[type="url"] { width: 90%; padding: 15px; background: #000; border: 1px solid #333; color: #fff; margin: 8px 0; font-size: 14px; outline: none; }
        .hw-control { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; font-size: 13px; }
        input[type="range"] { width: 60%; accent-color: #8b0000; }

        button { background: #1a1a1a; border: 1px solid #333; color: #888; padding: 14px; border-radius: 2px; font-size: 12px; width: 100%; margin: 5px 0; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .active-mode { background: #e0e0e0 !important; color: #000 !important; font-weight: bold; }
        .btn-send { background: #8b0000; color: #fff; border: none; font-weight: bold; margin-top: 10px; letter-spacing: 2px; }
        .btn-pay { background: #fff; color: #000; border: none; font-weight: bold; margin-top: 15px; }

        .payment-tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .pay-method { font-size: 10px; padding: 12px 5px; flex: 1; border: 1px solid #333; }

        /* Área de Instalação Móvel */
        #install-area { display: none; margin: 0 15px 20px 15px; gap: 10px; justify-content: center; }
    </style>
</head>
<body>

    <header>
        <button class="icon-btn" onclick="location.reload()" title="Atualizar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <h1>JOHAN</h1>
        <button class="icon-btn" onclick="toggleMenu()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
    </header>

    <div id="menu-overlay" onclick="toggleMenu()"></div>
    <div id="side-menu">
        <h2 style="color:#fff; font-weight:200;">CONFIGURAÇÕES</h2>
        <hr style="border:0; border-top:1px solid #222; margin:20px 0;">
        <label style="font-size:10px; color:#555;">WEBHOOK URL</label>
        <input type="url" id="config-webhook" placeholder="https://hook.make.com/..." onchange="saveConfig()">
        
        <p style="font-size:10px; color:#444; margin-top:30px;">
            JOHAN SENTINELA v2.0<br>
            Hardware: ESP32-S3 N16R8<br>
            Status: Licença Ativa
        </p>
        <button onclick="toggleMenu()" style="margin-top:20px; border-color:#8b0000; color:#8b0000;">Fechar</button>
    </div>

    <div id="install-area">
        <button onclick="triggerInstall()" style="background:#fff; color:#000; font-weight:bold;">Instalar App Johan</button>
    </div>

    <div class="card">
        <div class="status-area">
            <span class="dot"></span> PAINEL DO ROBÔ
        </div>
    </div>

    <div class="card">
        <h3>AJUSTES DO SENTINELA</h3>
        <div class="hw-control">
            <span>VOLUME: <b id="vol-perc">50</b>%</span>
            <input type="range" id="vol-slider" min="0" max="100" oninput="updateVolDisplay()" onchange="salvarHw()">
        </div>
    </div>

    <div class="card">
        <h3>COMANDO DE VOZ</h3>
        <input type="text" id="frase" placeholder="O que ele deve dizer?">
        <button class="btn-send" onclick="enviarComando()">Despertar o Monstro</button>
    </div>

    <div class="card">
        <h3>PERSONALIDADE</h3>
        <div style="display: flex; gap: 10px;">
            <button id="btn-filosofo" onclick="selecionarModo('filosofo')">Filósofo</button>
            <button id="btn-vendedor" onclick="selecionarModo('vendedor')">Vendedor</button>
        </div>
    </div>

    <div class="card">
        <h3>GESTÃO DE ASSINATURA</h3>
        <div class="payment-tabs">
            <button class="pay-method" id="tab-cartao" onclick="setPayTab('cartao')">Cartão</button>
            <button class="pay-method" id="tab-boleto" onclick="setPayTab('boleto')">Boleto</button>
            <button class="pay-method" id="tab-pix" onclick="setPayTab('pix')">PIX</button>
        </div>

        <div id="sec-cartao">
            <input type="text" placeholder="Número do Cartão">
            <div style="display: flex; gap: 5px; justify-content: center;">
                <input type="text" placeholder="MM/AA" style="width: 42%;">
                <input type="text" placeholder="CVC" style="width: 42%;">
            </div>
        </div>
        
        <div id="sec-boleto" style="display:none; padding: 15px;">
            <p style="font-size:12px;">Boleto disponível para fechamento do mês.</p>
        </div>

        <div id="sec-pix" style="display:none; padding: 15px;">
            <code id="pix-code" style="color:#00ff00; font-size:10px; word-break:break-all; display:block; background:#000; padding:10px; border:1px solid #333;">00020126360014BR.GOV.BCB.PIX...</code>
            <button onclick="copiarPix()" style="margin-top:10px; font-size:10px; width: auto; padding: 8px 20px;">Copiar Código</button>
        </div>

        <button class="btn-pay" onclick="confirmarPagamento()">EFETUAR PAGAMENTO</button>
    </div>

    <script>
        let deferredPrompt;
        const defaultWebhook = "https://hook.us2.make.com/z9ug682jka8xfl9ldrnez8tnmi3apoxc";

        // Registro PWA e Instalação
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-area').style.display = 'flex';
        });

        async function triggerInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') document.getElementById('install-area').style.display = 'none';
                deferredPrompt = null;
            }
        }

        // Funções de Interface
        function toggleMenu() {
            const menu = document.getElementById('side-menu');
            const overlay = document.getElementById('menu-overlay');
            const isOpen = menu.classList.contains('open');
            menu.classList.toggle('open');
            overlay.style.display = isOpen ? 'none' : 'block';
        }

        function saveConfig() {
            const url = document.getElementById('config-webhook').value;
            localStorage.setItem('customWebhook', url);
            alert("Configurações salvas.");
        }

        window.onload = function() {
            // Carregar Webhook
            document.getElementById('config-webhook').value = localStorage.getItem('customWebhook') || defaultWebhook;
            
            selecionarModo(localStorage.getItem('modoSelecionado') || 'filosofo');
            setPayTab(localStorage.getItem('abaPagamento') || 'cartao');
            const vol = localStorage.getItem('volume') || 50;
            document.getElementById('vol-slider').value = vol;
            document.getElementById('vol-perc').innerText = vol;
        };

        function updateVolDisplay() { document.getElementById('vol-perc').innerText = document.getElementById('vol-slider').value; }

        function selecionarModo(m) {
            localStorage.setItem('modoSelecionado', m);
            document.getElementById('btn-filosofo').classList.remove('active-mode');
            document.getElementById('btn-vendedor').classList.remove('active-mode');
            document.getElementById('btn-' + m).classList.add('active-mode');
        }

        function setPayTab(m) {
            localStorage.setItem('abaPagamento', m);
            ['cartao', 'boleto', 'pix'].forEach(tab => {
                document.getElementById('tab-' + tab).classList.remove('active-mode');
                document.getElementById('sec-' + tab).style.display = 'none';
            });
            document.getElementById('tab-' + m).classList.add('active-mode');
            document.getElementById('sec-' + m).style.display = 'block';
        }

        async function enviarComando() {
            const inputFrase = document.getElementById('frase');
            const frase = inputFrase.value.trim();
            if (!frase) return;

            const currentWebhook = localStorage.getItem('customWebhook') || defaultWebhook;

            try {
                const response = await fetch(currentWebhook, {
                    method: 'POST',
                    body: JSON.stringify({ mensagem: frase, modo: localStorage.getItem('modoSelecionado'), vol: localStorage.getItem('volume') }),
                    headers: { 'Content-Type': 'application/json' }
                });
                if (response.ok) {
                    alert("Johan recebeu sua mensagem.");
                    inputFrase.value = "";
                }
            } catch (err) { alert("Falha na conexão."); }
        }

        function salvarHw() { localStorage.setItem('volume', document.getElementById('vol-slider').value); }
        function copiarPix() { navigator.clipboard.writeText(document.getElementById('pix-code').innerText).then(() => alert("Copiado!")); }
        function confirmarPagamento() { alert("Processando..."); }
    </script>
</body>
</html>
