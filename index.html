<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Johan</title>
    <style>
        /* Paleta solicitada: Branco e Cinza */
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; color: #333; text-align: center; padding: 20px; }
        .card { background: #ffffff; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #ddd; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        /* Status: Apenas a bolinha colorida e o texto cinza solicitado */
        .status-area { display: flex; align-items: center; justify-content: center; gap: 8px; color: #666; font-size: 14px; font-weight: 500; }
        .dot { height: 12px; width: 12px; border-radius: 50%; transition: 0.3s; }
        .dot-online { background-color: #28a745; box-shadow: 0 0 5px #28a745; }
        .dot-offline { background-color: #ccc; }

        /* Estilo dos Botões e Inputs */
        h1 { font-weight: 300; letter-spacing: 2px; color: #222; margin-bottom: 30px; }
        input { width: 90%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin: 10px 0; font-size: 16px; background: #fafafa; }
        button { background: #eee; border: 1px solid #ddd; color: #555; padding: 12px; border-radius: 8px; font-size: 14px; width: 100%; margin: 5px 0; cursor: pointer; transition: 0.2s; }
        
        /* Botão Ativo/Selecionado */
        .active-mode { background: #333 !important; color: #fff !important; border-color: #333 !important; font-weight: bold; }
        
        .btn-send { background: #222; color: #fff; border: none; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>JOHAN</h1>
    
    <div class="card">
        <div class="status-area">
            <span id="status-dot" class="dot dot-online"></span>
            PAINEL DO ROBÔ
        </div>
    </div>

    <div class="card">
        <h3>COMANDO DE VOZ</h3>
        <input type="text" id="frase" placeholder="O que ele deve dizer?">
        <button class="btn-send" onclick="enviarComando()">ENVIAR COMANDO</button>
    </div>

    <div class="card">
        <h3>MODO DE OPERAÇÃO</h3>
        <div style="display: flex; gap: 10px;">
            <button id="btn-filosofo" onclick="selecionarModo('filosofo')">MODO FILÓSOFO</button>
            <button id="btn-vendedor" onclick="selecionarModo('vendedor')">MODO VENDEDOR</button>
        </div>
    </div>

    <script>
        const webhookURL = "https://hook.us2.make.com/z9ug682jka8xfl9ldrnez8tnmi3apoxc";

        // Ao carregar a página, verifica qual modo estava salvo
        window.onload = function() {
            const modoSalvo = localStorage.getItem('modoSelecionado') || 'filosofo';
            selecionarModo(modoSalvo);
        };

        function selecionarModo(modo) {
            // Salva a escolha no navegador
            localStorage.setItem('modoSelecionado', modo);
            
            // Reseta visual dos botões
            document.getElementById('btn-filosofo').classList.remove('active-mode');
            document.getElementById('btn-vendedor').classList.remove('active-mode');
            
            // Ativa o botão correto
            document.getElementById('btn-' + modo).classList.add('active-mode');
        }

        async function enviarComando() {
            const frase = document.getElementById('frase').value;
            const dot = document.getElementById('status-dot');
            const modoAtual = localStorage.getItem('modoSelecionado');

            try {
                const response = await fetch(webhookURL, {
                    method: 'POST',
                    body: JSON.stringify({ mensagem: frase, modo: modoAtual }),
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    dot.className = "dot dot-online";
                    alert("Enviado com sucesso.");
                } else {
                    throw new Error();
                }
            } catch (err) {
                // Se o sinal cair, a bolinha fica cinza
                dot.className = "dot dot-offline";
                alert("Falha na conexão com o robô.");
            }
        }
    </script>
</body>
</html>
