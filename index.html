<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johan Control</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: #b0b0b0; text-align: center; padding: 20px; margin: 0; }
        .card { background: #111; border-radius: 4px; padding: 20px; margin-bottom: 20px; border: 1px solid #222; }
        
        /* Botão de Instalação Especial */
        #install-button { 
            display: none; /* Escondido por padrão */
            background: #fff; color: #000; font-weight: bold; border: none; 
            padding: 15px; margin-bottom: 20px; letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        .status-area { display: flex; align-items: center; justify-content: center; gap: 10px; color: #888; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
        .dot { height: 10px; width: 10px; border-radius: 50%; transition: 0.3s; }
        .dot-online { background-color: #00ff00; box-shadow: 0 0 8px #00ff00; }
        
        h1 { font-weight: 200; letter-spacing: 10px; color: #fff; margin-bottom: 30px; text-transform: uppercase; }
        input[type="text"] { width: 90%; padding: 15px; background: #000; border: 1px solid #333; color: #fff; margin: 8px 0; font-size: 14px; outline: none; }
        
        .hw-control { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; font-size: 13px; }
        input[type="range"] { width: 60%; accent-color: #8b0000; }

        button { background: #1a1a1a; border: 1px solid #333; color: #888; padding: 14px; border-radius: 2px; font-size: 12px; width: 100%; margin: 5px 0; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        button:active { transform: scale(0.98); opacity: 0.8; }
        
        .active-mode { background: #e0e0e0 !important; color: #000 !important; font-weight: bold; border-color: #fff !important; }
        .btn-send { background: #8b0000; color: #fff; border: none; font-weight: bold; margin-top: 10px; letter-spacing: 2px; }
        .btn-pay { background: #fff; color: #000; border: none; font-weight: bold; margin-top: 15px; }

        .payment-tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .pay-method { font-size: 10px; padding: 12px 5px; flex: 1; border: 1px solid #333; }
        .btn-cancel { background: transparent; border: 1px solid #333; color: #444; font-size: 10px; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>JOHAN</h1>

    <button id="install-button">INSTALAR APP JOHAN</button>

    <div class="card">
        <div class="status-area">
            <span id="status-dot" class="dot dot-online"></span> PAINEL DO ROBÔ
        </div>
    </div>

    <div class="card">
        <h3>AJUSTES DO SENTINELA</h3>
        <div class="hw-control">
            <span>VOLUME: <b id="vol-perc">50</b>%</span>
            <input type="range" id="vol-slider" min="0" max="100" oninput="updateVolDisplay()" onchange="salvarHw()">
        </div>
    </div>

    <div class="card">
        <h3>COMANDO DE VOZ</h3>
        <input type="text" id="frase" placeholder="O que ele deve dizer?">
        <button class="btn-send" onclick="enviarComando()">Despertar o Monstro</button>
    </div>

    <div class="card">
        <h3>PERSONALIDADE</h3>
        <div style="display: flex; gap: 10px;">
            <button id="btn-filosofo" onclick="selecionarModo('filosofo')">Filósofo</button>
            <button id="btn-vendedor" onclick="selecionarModo('vendedor')">Vendedor</button>
        </div>
    </div>

    <div class="card">
        <h3>GESTÃO DE ASSINATURA</h3>
        <div class="payment-tabs">
            <button class="pay-method" id="tab-cartao" onclick="setPayTab('cartao')">Cartão</button>
            <button class="pay-method" id="tab-boleto" onclick="setPayTab('boleto')">Boleto</button>
            <button class="pay-method" id="tab-pix" onclick="setPayTab('pix')">PIX</button>
        </div>

        <div id="sec-cartao">
            <input type="text" placeholder="Número do Cartão">
            <div style="display: flex; gap: 5px; justify-content: center;">
                <input type="text" placeholder="MM/AA" style="width: 42%;">
                <input type="text" placeholder="CVC" style="width: 42%;">
            </div>
        </div>
        
        <div id="sec-boleto" style="display:none; padding: 15px;">
            <p style="font-size:12px;">Boleto disponível para fechamento do mês.</p>
        </div>

        <div id="sec-pix" style="display:none; padding: 15px;">
            <code id="pix-code" style="color:#00ff00; font-size:10px; word-break:break-all; display:block; background:#000; padding:10px; border:1px solid #333;">00020126360014BR.GOV.BCB.PIX...</code>
            <button onclick="copiarPix()" style="margin-top:10px; font-size:10px; width: auto; padding: 8px 20px;">Copiar Código</button>
        </div>

        <button class="btn-pay" onclick="confirmarPagamento()">EFETUAR PAGAMENTO</button>
        <button class="btn-cancel" onclick="cancelarAssinatura()">CANCELAR CARTÃO E ASSINATURA</button>
    </div>

    <script>
        // Lógica de Instalação (PWA)
        let deferredPrompt;
        const installBtn = document.getElementById('install-button');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block'; // Mostra o botão [Pedido do usuário]
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.style.display = 'none'; // Some após instalar [Pedido do usuário]
                }
                deferredPrompt = null;
            }
        });

        // Se já estiver rodando como app, esconde o botão
        if (window.matchMedia('(display-mode: standalone)').matches) {
            installBtn.style.display = 'none';
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        const webhookURL = "https://hook.us2.make.com/z9ug682jka8xfl9ldrnez8tnmi3apoxc";

        window.onload = function() {
            selecionarModo(localStorage.getItem('modoSelecionado') || 'filosofo');
            setPayTab(localStorage.getItem('abaPagamento') || 'cartao');
            const vol = localStorage.getItem('volume') || 50;
            document.getElementById('vol-slider').value = vol;
            document.getElementById('vol-perc').innerText = vol;
        };

        function updateVolDisplay() {
            document.getElementById('vol-perc').innerText = document.getElementById('vol-slider').value;
        }

        function selecionarModo(m) {
            localStorage.setItem('modoSelecionado', m);
            document.getElementById('btn-filosofo').classList.remove('active-mode');
            document.getElementById('btn-vendedor').classList.remove('active-mode');
            document.getElementById('btn-' + m).classList.add('active-mode');
        }

        function setPayTab(m) {
            localStorage.setItem('abaPagamento', m);
            ['cartao', 'boleto', 'pix'].forEach(tab => {
                document.getElementById('tab-' + tab).classList.remove('active-mode');
                document.getElementById('sec-' + tab).style.display = 'none';
            });
            document.getElementById('tab-' + m).classList.add('active-mode');
            document.getElementById('sec-' + m).style.display = 'block';
        }

        async function enviarComando() {
            const inputFrase = document.getElementById('frase');
            const frase = inputFrase.value.trim();
            if (!frase) return; // Não envia se estiver vazio [Pedido do usuário]

            try {
                const response = await fetch(webhookURL, {
                    method: 'POST',
                    body: JSON.stringify({ mensagem: frase, modo: localStorage.getItem('modoSelecionado'), vol: localStorage.getItem('volume') }),
                    headers: { 'Content-Type': 'application/json' }
                });
                if (response.ok) {
                    alert("Johan recebeu sua mensagem.");
                    inputFrase.value = ""; // Limpa após enviar [Pedido do usuário]
                }
            } catch (err) { alert("Falha na conexão."); }
        }

        function salvarHw() { localStorage.setItem('volume', document.getElementById('vol-slider').value); }
        function copiarPix() { navigator.clipboard.writeText(document.getElementById('pix-code').innerText).then(() => alert("Copiado!")); }
        function confirmarPagamento() { alert("Processando..."); }
        function cancelarAssinatura() { if(confirm("Deseja cancelar?")) alert("Assinatura cancelada."); }
    </script>
</body>
</html>
