<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johan Control</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* Estética "Johan": Fria, minimalista e clínica */
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; text-align: center; padding: 20px; }
        .card { background: #141414; border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid #222; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        /* Status solicitado: Verde quando online, Cinza quando offline */
        .status { font-weight: bold; margin-bottom: 10px; transition: 0.3s; }
        .online { color: #00ff00; }
        .offline { color: #7a7a7a; }
        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .dot-online { background-color: #00ff00; box-shadow: 0 0 8px #00ff00; }
        .dot-offline { background-color: #7a7a7a; }

        /* Botões e Inputs: Melhoramos a leitura */
        h1 { font-weight: 200; letter-spacing: 8px; color: #fff; margin-bottom: 30px; }
        input { width: 90%; padding: 15px; background: #000; border: 1px solid #333; color: #fff; border-radius: 4px; margin: 10px 0; font-size: 16px; }
        button { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 15px; border-radius: 4px; font-size: 14px; width: 100%; margin: 8px 0; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        button:active { background: #333; }
        .btn-main { border-color: #444; font-weight: bold; background: #222; }

        /* Cartão de Teste de Assinatura */
        .sub-card { border-top: 2px solid #8b0000; }
        .price { font-size: 24px; color: #fff; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>JOHAN</h1>
    
    <div class="card">
        <div id="status-container" class="status online">
            <span id="status-dot" class="dot dot-online"></span>
            <span id="status-text">ROBÔ ONLINE</span>
        </div>
        <p style="font-size: 12px; color: #666;">MODELO: ESP32-S3 N16R8</p>
    </div>

    <div class="card">
        <h3>COMANDO DE VOZ</h3>
        <input type="text" id="frase" placeholder="Qual verdade ele deve sussurrar?">
        <button class="btn-main" onclick="enviarComando()">Despertar o Monstro</button>
    </div>

    <div class="card">
        <h3>PERSONALIDADE</h3>
        <div style="display: flex; gap: 10px;">
            <button onclick="mudarModo('filosofo')">Filósofo</button>
            <button onclick="mudarModo('vendedor')">Vendedor</button>
        </div>
    </div>

    <div class="card sub-card">
        <h3>PLANO EXPERIMENTAL</h3>
        <div class="price">R$ 1,00 <span style="font-size: 12px; color: #666;">/mês</span></div>
        <input type="text" placeholder="0000 0000 0000 0000" maxlength="16">
        <div style="display: flex; gap: 10px;">
            <input type="text" placeholder="MM/AA" style="width: 40%;">
            <input type="text" placeholder="CVC" style="width: 40%;">
        </div>
        <button onclick="testarPagamento()" style="background: #8b0000; border: none;">Assinar Agora</button>
    </div>

    <script>
        const webhookURL = "https://hook.us2.make.com/z9ug682jka8xfl9ldrnez8tnmi3apoxc";

        async function enviarComando() {
            const frase = document.getElementById('frase').value;
            const statusText = document.getElementById('status-text');
            const statusDot = document.getElementById('status-dot');
            const container = document.getElementById('status-container');

            try {
                const response = await fetch(webhookURL, {
                    method: 'POST',
                    body: JSON.stringify({ mensagem: frase }),
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    alert("Johan recebeu sua mensagem.");
                } else {
                    throw new Error();
                }
            } catch (err) {
                // Se o sinal cair ou der erro, fica cinza
                container.className = "status offline";
                statusDot.className = "dot dot-offline";
                statusText.innerText = "SINAL PERDIDO";
            }
        }

        function testarPagamento() {
            alert("Teste de checkout: R$ 1,00 processado no ambiente de sandbox.");
        }
    </script>
</body>
</html>
