<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johan Control</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: #b0b0b0; text-align: center; padding: 20px; }
        .card { background: #111; border-radius: 4px; padding: 20px; margin-bottom: 20px; border: 1px solid #222; }
        .status-area { display: flex; align-items: center; justify-content: center; gap: 10px; color: #888; font-size: 12px; }
        .dot { height: 10px; width: 10px; border-radius: 50%; transition: 0.3s; }
        .dot-online { background-color: #00ff00; box-shadow: 0 0 8px #00ff00; }
        .dot-offline { background-color: #444; }
        h1 { font-weight: 200; letter-spacing: 10px; color: #fff; margin-bottom: 30px; }
        input[type="text"] { width: 90%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; margin: 8px 0; font-size: 15px; }
        .hw-control { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; font-size: 13px; }
        input[type="range"] { width: 60%; accent-color: #8b0000; }
        button { background: #1a1a1a; border: 1px solid #333; color: #888; padding: 14px; width: 100%; margin: 5px 0; cursor: pointer; text-transform: uppercase; transition: 0.1s; }
        button:active { transform: scale(0.98); }
        .active-mode { background: #e0e0e0 !important; color: #000 !important; font-weight: bold; }
        .btn-send { background: #8b0000; color: #fff; border: none; font-weight: bold; margin-top: 10px; letter-spacing: 2px; }
        .btn-cancel { background: transparent; border: 1px solid #444; color: #444; font-size: 10px; margin-top: 15px; }
        .payment-tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .pay-method { font-size: 10px; padding: 10px 5px; flex: 1; border: 1px solid #333; }
    </style>
</head>
<body>
    <h1>JOHAN</h1>

    <div class="card">
        <div class="status-area">
            <span id="status-dot" class="dot dot-online"></span> PAINEL DO ROBÔ
        </div>
    </div>

    <div class="card">
        <h3>AJUSTES DO SENTINELA</h3>
        <div class="hw-control"><span>VOLUME</span><input type="range" id="vol-slider" onchange="salvarConfig()"></div>
    </div>

    <div class="card">
        <h3>COMANDO DE VOZ</h3>
        <input type="text" id="frase" placeholder="O que ele deve dizer?">
        <button class="btn-send" onclick="enviarComando()">Despertar o Monstro</button>
    </div>

    <div class="card">
        <h3>PERSONALIDADE</h3>
        <div style="display: flex; gap: 10px;">
            <button id="btn-filosofo" onclick="selecionarModo('filosofo')">Filósofo</button>
            <button id="btn-vendedor" onclick="selecionarModo('vendedor')">Vendedor</button>
        </div>
    </div>

    <div class="card">
        <h3>GESTÃO DE ASSINATURA</h3>
        <div class="payment-tabs">
            <button class="pay-method" id="tab-cartao" onclick="setPayTab('cartao')">Cartão</button>
            <button class="pay-method" id="tab-boleto" onclick="setPayTab('boleto')">Boleto</button>
            <button class="pay-method" id="tab-pix" onclick="setPayTab('pix')">PIX</button>
        </div>
        <div id="sec-cartao">
            <input type="text" placeholder="Número do Cartão">
            <button onclick="confirmarPagamento()" style="background:#fff; color:#000; font-weight:bold;">PAGAR MENSALIDADE</button>
            <button class="btn-cancel" onclick="cancelarCartao()">CANCELAR CARTÃO E ASSINATURA</button>
        </div>
    </div>

    <script>
        const webhookURL = "https://hook.us2.make.com/z9ug682jka8xfl9ldrnez8tnmi3apoxc";

        // Registro do Service Worker para rodar em segundo plano
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log("PWA Ativo"));
        }

        window.onload = function() {
            selecionarModo(localStorage.getItem('modoSelecionado') || 'filosofo');
            setPayTab(localStorage.getItem('abaPagamento') || 'cartao');
        };

        function selecionarModo(m) {
            localStorage.setItem('modoSelecionado', m);
            document.querySelectorAll('.active-mode').forEach(b => b.classList.remove('active-mode'));
            document.getElementById('btn-' + m).classList.add('active-mode');
        }

        async function cancelarCartao() {
            if(confirm("Deseja realmente cancelar a assinatura do Johan? O robô será desativado.")) {
                // Envia comando para o Make inativar no Asaas
                const response = await fetch(webhookURL, {
                    method: 'POST',
                    body: JSON.stringify({ acao: 'cancelar_assinatura', cliente: 'Johan_User' }),
                    headers: { 'Content-Type': 'application/json' }
                });
                if(response.ok) alert("Assinatura cancelada com sucesso.");
            }
        }

        async function enviarComando() {
            const frase = document.getElementById('frase').value;
            try {
                const response = await fetch(webhookURL, {
                    method: 'POST',
                    body: JSON.stringify({ mensagem: frase, modo: localStorage.getItem('modoSelecionado') }),
                    headers: { 'Content-Type': 'application/json' }
                });
                if (response.ok) alert("Johan recebeu a mensagem.");
            } catch (e) { document.getElementById('status-dot').className = "dot dot-offline"; }
        }

        function setPayTab(m) { localStorage.setItem('abaPagamento', m); }
    </script>
</body>
</html>
